plugins {
    id "com.android.application"
}

android {
    namespace "fi.somby.satnifst"
    compileSdk 35
    buildToolsVersion "35.0.0"  // sama kuin packaging/android/Dockerfile

    defaultConfig {
        applicationId "fi.somby.satnifst"
        minSdk 24
        targetSdk 35
        // build_apk.sh antaa nämä version.py:stä (0.7.3.20261030.6 -> 2026103006)
        versionCode((project.findProperty("satniVersionCode") ?: "1") as int)
        versionName(project.findProperty("satniVersionName") ?: "dev")
        // test-haara: oma sovellus-id ja nimi, jotta koeversio asentuu dev- ja julkaisuversion rinnalle.
        // Poistetaan, kun test yhdistetään deviin.
        applicationIdSuffix ".test"
        manifestPlaceholders = [appLabel: "Sátni FST test"]
        // Tekstintunnistuksen natiivikirjasto on ~11 Mt suoritintyyppiä kohden: APK:hon vain puhelimien ARM-versiot.
        // Debug-versioon (emulaattori) build_apk.sh --debug lisää x86_64:n: -PsatniAbis=x86_64,arm64-v8a.
        ndk { abiFilters.addAll((project.findProperty("satniAbis") ?: "arm64-v8a,armeabi-v7a").split(",")) }
    }
    // Natiivikirjastot pakattuina: APK on pienempi ladata, Android purkaa kirjaston asennettaessa
    packaging {
        jniLibs { useLegacyPackaging = true }
    }

    // Sama web-käyttöliittymä kuin PWA:ssa ja työpöytäversiossa (web/, sanakirja web/data/)
    sourceSets {
        main { assets.srcDirs = ["../../web"] }
    }
    // WebAssembly pakkaamattomana. Sanakirjan .gz-tiedoston käännös purkaa itse (ks. MainActivity.openAsset).
    androidResources {
        noCompress += ["wasm"]
    }

    // Julkaisuavain (packaging/android/luo_allekirjoitusavain.sh): build_apk.sh antaa kansion, jossa on
    // satni-fst-release.jks ja keystore.properties. Avain ja salasana eivät ole versionhallinnassa.
    def signingDir = System.getenv("SATNI_SIGNING_DIR")
    def signingProps = signingDir ? file("${signingDir}/keystore.properties") : null
    signingConfigs {
        if (signingProps?.exists()) {
            release {
                def props = new Properties()
                signingProps.withInputStream { props.load(it) }
                storeFile file("${signingDir}/satni-fst-release.jks")
                storePassword props.getProperty("storePassword")
                keyAlias props.getProperty("keyAlias")
                keyPassword props.getProperty("keyPassword")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
            if (signingProps?.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Tekstintunnistus kuvasta (OCR) laitteella: malli on APK:ssa ("bundled"), joten se toimii ilman
    // verkkoyhteyttä ja Google Play -palveluita. Kuvat eivät lähde laitteelta.
    implementation "com.google.mlkit:text-recognition:16.0.1"
    // FileProvider: kamerasovellus tallentaa kuvan sovelluksen välimuistiin (ei CAMERA-lupaa)
    implementation "androidx.core:core:1.13.1"
    // Riippuvuudet tuovat Kotlinin peruskirjastosta eri versioita: yksi versio kaikille
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")
}
