<title>Sátni FST – pohjoissaamen sanakirja ja taivutin</title>
<meta name="description" content="Pohjoissaamen sanakirja ja taivutin, joka toimii ilman verkkoyhteyttä. Nordsamisk ordbok og bøyingsverktøy. Offline North Sámi dictionary with full inflection.">
<link rel="icon" href="satni-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="site.css">
<script>
  // Kieli selaimen mukaan tai aiemman valinnan mukaan: fi, nb tai en (ks. site.js)
  try {
    var saved = localStorage.getItem("satni-site-lang");
    var nav = (navigator.language || "fi").toLowerCase();
    document.documentElement.lang = saved || (/^(nb|nn|no)/.test(nav) ? "nb" : /^fi/.test(nav) ? "fi" : /^se/.test(nav) ? "fi" : "en");
  } catch (e) {}
</script>
