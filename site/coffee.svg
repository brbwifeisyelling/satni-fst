<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Buy Me a Coffee -profiilikuva: Sátni FST -pisara (satni-icon.svg) putoaa kahvikuppiin.
       Neliö, mutta kaikki tärkeä on ympyrän sisällä (palvelu rajaa profiilikuvan pyöreäksi). -->
  <defs>
    <path id="drop" d="M50 9 C56 9 88 30 88 57 A38 38 0 1 1 12 57 C12 30 44 9 50 9 Z"/>
    <clipPath id="clip"><use href="#drop"/></clipPath>
    <clipPath id="left"><rect x="0" y="0" width="50" height="100"/></clipPath>
    <clipPath id="right"><rect x="50" y="0" width="50" height="100"/></clipPath>
  </defs>
  <rect width="100" height="100" fill="#fbf1e1"/>

  <!-- Lautanen ja kuppi -->
  <ellipse cx="47" cy="85" rx="27" ry="3.6" fill="#3b2a20"/>
  <path d="M66 60.5 C77.5 60.5 77.5 75 65 75" fill="none" stroke="#3b2a20" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M27 57 H67 V68 A14.5 14.5 0 0 1 52.5 82.5 H41.5 A14.5 14.5 0 0 1 27 68 Z" fill="#3b2a20"/>
  <!-- Kahvin pinta ja pisaran tekemät renkaat -->
  <ellipse cx="47" cy="57" rx="20" ry="3.8" fill="#7a4a2c"/>
  <ellipse cx="47" cy="57" rx="8" ry="1.5" fill="none" stroke="#b07a52" stroke-width="0.9"/>
  <ellipse cx="47" cy="57" rx="13.5" ry="2.5" fill="none" stroke="#b07a52" stroke-width="0.6" opacity=".7"/>

  <!-- Pisara (saamen lippu), pienennetty logo -->
  <g transform="translate(27.8 9.5) scale(0.385)">
    <g clip-path="url(#clip)">
      <rect x="0" y="0" width="44" height="100" fill="#dc241f"/>
      <rect x="44" y="0" width="6" height="100" fill="#007229"/>
      <rect x="50" y="0" width="6" height="100" fill="#ffce00"/>
      <rect x="56" y="0" width="44" height="100" fill="#0035ad"/>
      <circle cx="50" cy="57" r="21" fill="none" stroke="#0035ad" stroke-width="5.5" clip-path="url(#left)"/>
      <circle cx="50" cy="57" r="21" fill="none" stroke="#dc241f" stroke-width="5.5" clip-path="url(#right)"/>
    </g>
  </g>
</svg>
